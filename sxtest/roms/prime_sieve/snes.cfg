# SNES LoROM Linker Configuration for cc65
# Minimal configuration for prime sieve test ROM

SYMBOLS {
    __STACKSTART__: type = weak, value = $1FFF;
}

MEMORY {
    # Zero page / Direct page
    ZP:         file = "", start = $0000, size = $0100, type = rw, define = yes;

    # Low RAM (stack and BSS)
    LORAM:      file = "", start = $0100, size = $1F00, type = rw, define = yes;

    # ROM Bank 0: $8000-$FFB0 (code)
    ROM0:       file = %O, start = $8000, size = $7FB0, fill = yes, fillval = $00;

    # ROM Header: $FFB0-$FFFF (80 bytes)
    ROMHDR:     file = %O, start = $FFB0, size = $0050, fill = yes, fillval = $00;
}

SEGMENTS {
    # Zero page variables
    ZEROPAGE:   load = ZP, type = zp;

    # BSS (uninitialized data)
    BSS:        load = LORAM, type = bss, define = yes;

    # Startup code (reset vector target)
    STARTUP:    load = ROM0, type = ro, define = yes, start = $8000;

    # Main code
    CODE:       load = ROM0, type = ro, define = yes;

    # Read-only data (strings, tables)
    RODATA:     load = ROM0, type = ro, define = yes;

    # Initialized data
    DATA:       load = ROM0, type = ro, define = yes;

    # ROM Header and Vectors
    ROMHDR:     load = ROMHDR, type = ro;
    VECTORS:    load = ROMHDR, type = ro, start = $FFE0;
}
